name: Ping Supabase Projects

on:
  schedule:
    # Every 5 days at 00:00 UTC. GitHub may delay scheduled runs by a few
    # minutes under load, which is fine here.
    - cron: "0 0 */5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping projects
        env:
          CPC_CONNECT_ANON_KEY: ${{ secrets.CPC_CONNECT_ANON_KEY }}
          DEFECT_TRACKER_ANON_KEY: ${{ secrets.DEFECT_TRACKER_ANON_KEY }}
          VEHICLE_DASHBOARD_ANON_KEY: ${{ secrets.VEHICLE_DASHBOARD_ANON_KEY }}
        run: python ping.py

      - name: Commit updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update ping status"
          git push
