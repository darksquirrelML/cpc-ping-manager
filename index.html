<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --fail: #dc2626;
    --fail-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1e2127;
      --text: #f0f1f3;
      --muted: #9aa1ac;
      --border: #2c2f36;
      --ok: #4ade80;
      --ok-bg: #14331f;
      --fail: #f87171;
      --fail-bg: #3a1616;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; }
  .logo { width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0; }
  h1 { font-size: 1.4rem; margin: 0; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card .name { font-weight: 600; }
  .card .meta { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  #empty { color: var(--muted); font-size: 0.9rem; }
  footer { margin-top: 24px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>

  <p class="subtitle" id="last-run">Loading status&hellip;</p>

  <div id="cards"></div>

  <footer>Pings run automatically every 5 days via GitHub Actions to keep these Supabase projects from being paused for inactivity.</footer>

<script>
function timeAgo(isoString) {
  const then = new Date(isoString);
  const diffMs = Date.now() - then.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "h ago";
  const days = Math.floor(hours / 24);
  return days + "d ago";
}

fetch('./status.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    const lastRun = document.getElementById('last-run');
    lastRun.textContent = data.last_run_at
      ? `Last checked ${timeAgo(data.last_run_at)} (${new Date(data.last_run_at).toLocaleString()})`
      : 'No run recorded yet';

    const cardsEl = document.getElementById('cards');
    const projects = data.projects || [];

    if (projects.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    projects.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';

      const left = document.createElement('div');
      left.innerHTML = `
        <div class="name">${p.name}</div>
        <div class="meta">${p.ref}.supabase.co &middot; checked ${timeAgo(p.checked_at)} &middot; ${p.response_ms ?? '?'}ms${p.error ? ' &middot; ' + p.error : ''}</div>
      `;

      const badge = document.createElement('span');
      badge.className = 'badge ' + (p.ok ? 'ok' : 'fail');
      badge.innerHTML = `<span class="dot"></span>${p.ok ? 'Alive' : 'Failed'}`;

      card.appendChild(left);
      card.appendChild(badge);
      cardsEl.appendChild(card);
    });
  })
  .catch(() => {
    document.getElementById('last-run').textContent = 'Could not load status.json';
    document.getElementById('empty').style.display = 'block';
  });
</script>
</body>
</html>
